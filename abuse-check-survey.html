
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>虐待の芽チェックリスト（入所施設版）</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{
    --ink:#2f3b34;
    --paper:#f6f4ee;
    --line:#d8d2c2;
    --moss:#5b7360;
    --moss-dark:#3f5245;
    --clay:#b5613f;
    --warn-bg:#fbe9a8;
    --warn-border:#e0b93c;
    --card:#ffffff;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
    background:var(--paper);
    color:var(--ink);
    line-height:1.7;
    padding-bottom:60px;
  }
  header{
    background:var(--moss-dark);
    color:#f6f4ee;
    padding:22px 16px 20px;
    text-align:center;
  }
  header h1{
    margin:0 0 4px;
    font-size:1.25rem;
    letter-spacing:.02em;
  }
  header p{
    margin:0;
    font-size:.82rem;
    opacity:.85;
  }
  .tabbar{
    display:flex;
    max-width:760px;
    margin:16px auto 0;
    padding:0 12px;
    gap:8px;
  }
  .tabbar button{
    flex:1;
    padding:10px 6px;
    border:1px solid var(--line);
    background:var(--card);
    color:var(--moss-dark);
    border-radius:8px 8px 0 0;
    font-size:.85rem;
    cursor:pointer;
  }
  .tabbar button.active{
    background:var(--moss);
    color:#fff;
    border-color:var(--moss);
    font-weight:bold;
  }
  main{
    max-width:760px;
    margin:0 auto;
    padding:18px 12px 40px;
  }
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:10px;
    padding:18px 16px;
    margin-bottom:16px;
  }
  .view{display:none;}
  .view.active{display:block;}
  label.field-label{
    display:block;
    font-size:.85rem;
    color:var(--moss-dark);
    font-weight:bold;
    margin-bottom:6px;
  }
  select, input[type=text], input[type=password], input[type=number]{
    width:100%;
    padding:10px;
    border:1px solid var(--line);
    border-radius:8px;
    font-size:.95rem;
    background:#fff;
    color:var(--ink);
    margin-bottom:14px;
  }
  .qcard{
    border:1px solid var(--line);
    border-radius:8px;
    padding:14px;
    margin-bottom:14px;
    background:#fdfcf9;
  }
  .qnum{
    display:inline-block;
    background:var(--moss);
    color:#fff;
    font-size:.75rem;
    font-weight:bold;
    padding:2px 9px;
    border-radius:20px;
    margin-bottom:6px;
  }
  .qtext{font-size:.92rem;margin:0 0 10px;}
  .opts{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px;}
  .opt-btn{
    flex:1;
    min-width:110px;
    text-align:center;
    padding:10px 8px;
    border:1.5px solid var(--line);
    border-radius:8px;
    cursor:pointer;
    font-size:.88rem;
    background:#fff;
    user-select:none;
  }
  .opt-btn.selected{
    background:var(--moss);
    color:#fff;
    border-color:var(--moss);
    font-weight:bold;
  }
  .obs-row{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:.82rem;
    color:#5a5548;
    border-top:1px dashed var(--line);
    padding-top:8px;
    cursor:pointer;
  }
  .obs-row input{width:auto;margin:0;}
  .btn{
    display:inline-block;
    width:100%;
    padding:13px;
    background:var(--clay);
    color:#fff;
    border:none;
    border-radius:8px;
    font-size:1rem;
    font-weight:bold;
    cursor:pointer;
  }
  .btn.secondary{background:var(--moss);}
  .btn.ghost{background:#fff;color:var(--moss-dark);border:1.5px solid var(--moss);}
  .note{font-size:.8rem;color:#77705f;margin-top:6px;}
  .toast{
    position:fixed;left:50%;bottom:24px;transform:translateX(-50%);
    background:var(--moss-dark);color:#fff;padding:12px 20px;border-radius:20px;
    font-size:.9rem;box-shadow:0 6px 18px rgba(0,0,0,.2);display:none;z-index:50;
  }
  table.agg{
    width:100%;
    border-collapse:collapse;
    font-size:.78rem;
  }
  table.agg th, table.agg td{
    border:1px solid var(--line);
    padding:6px 5px;
    text-align:center;
    vertical-align:middle;
  }
  table.agg th{background:var(--moss-dark);color:#fff;}
  table.agg td.qtext-cell{text-align:left;font-size:.76rem;}
  table.agg td.warn{background:var(--warn-bg);border-color:var(--warn-border);font-weight:bold;}
  .table-scroll{overflow-x:auto;}
  .staff-grid{display:grid;grid-template-columns:1fr 90px;gap:8px;align-items:center;margin-bottom:6px;}
  .staff-grid span{font-size:.85rem;}
  .rate-card{
    display:flex;justify-content:space-between;align-items:center;
    padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;font-size:.85rem;
  }
  .rate-card b{color:var(--moss-dark);}
  #qrWrap{text-align:center;padding:16px;}
  .locked{text-align:center;padding:30px 10px;}
  .filters{display:flex;gap:10px;margin-bottom:14px;}
  .filters select{margin-bottom:0;}
</style>
</head>
<body>

<header>
  <h1>虐待の芽チェックリスト（入所施設版）</h1>
  <p>匿名アンケート・悠久福祉会 虐待防止委員会</p>
</header>

<div class="tabbar">
  <button id="tabSurveyBtn" class="active" onclick="switchTab('survey')">職員回答</button>
  <button id="tabCommitteeBtn" onclick="switchTab('committee')">委員会（集計）</button>
</div>

<main>

  <!-- ============ 職員回答画面 ============ -->
  <div id="view-survey" class="view active">
    <div class="card">
      <label class="field-label">実施回（例：2026年7月度）</label>
      <input type="text" id="roundInput" placeholder="2026年7月度">
      <label class="field-label">施設</label>
      <select id="facilitySelect">
        <option value="">選択してください</option>
      </select>
      <p class="note">回答は匿名で集計されます。個人が特定される情報は記録されません。</p>
    </div>

    <div id="questionsWrap"></div>

    <button class="btn" id="submitBtn">回答を送信する</button>
  </div>

  <!-- ============ 委員会画面 ============ -->
  <div id="view-committee" class="view">

    <div id="lockScreen" class="card locked">
      <p>委員会用パスワードを入力してください</p>
      <input type="password" id="pwInput" placeholder="パスワード">
      <button class="btn secondary" onclick="checkPassword()">開く</button>
    </div>

    <div id="committeeBody" style="display:none;">

      <div class="card">
        <label class="field-label">施設別 職員数の設定（回収率の計算に使用）</label>
        <div id="staffGrid"></div>
        <button class="btn ghost" onclick="saveStaffCounts()">職員数を保存</button>
      </div>

      <div class="card">
        <label class="field-label">回収状況</label>
        <div id="rateWrap"></div>
      </div>

      <div class="card">
        <label class="field-label">集計結果</label>
        <div class="filters">
          <select id="roundFilter"></select>
          <select id="facilityFilter"></select>
        </div>
        <div class="table-scroll" id="aggTableWrap"></div>
        <p class="note">黄色は、回答が総数の35%以上を占めた項目です。</p>
        <button class="btn secondary" id="exportBtn" style="margin-top:10px;">Excelでダウンロード</button>
      </div>

      <div class="card" id="qrWrap">
        <label class="field-label">回答用URL（QRコード）</label>
        <div id="qrcode"></div>
        <p class="note" id="urlText"></p>
      </div>

    </div>
  </div>

</main>

<div class="toast" id="toast"></div>

<script>
// ==== 設定 ====
var GAS_URL = 'https://script.google.com/macros/s/AKfycbyECZk0qGV3KR7Nk98uFAOMAGy1JMaZVGi4iHCO1oIE-Y8ReKZVLy1KxOC7H35QTjA5Tw/exec';
var COMMITTEE_PASSWORD = '2408';

var FACILITIES = [
  '悠久の里一番館', '悠久の里二番館', '悠久の里三番館',
  '悠久の里横尾', '悠久の里佐伯', '悠久の里米良', 'みどりの郷ほんじょう'
];

var QUESTIONS = [
 {n:1, text:'利用者に友達感覚で接したり、子供扱いしたりしていませんか?', opt1:'している', opt2:'していない', obs:'見たこと・聞いたことがある'},
 {n:2, text:'利用者に対して、アセスメント・施設サービス計画書に基づかず、あだ名や〇〇ちゃん呼び、呼び捨てなどをしていませんか?', opt1:'している', opt2:'していない', obs:'聞いたことがある'},
 {n:3, text:'利用者に対して、威圧的な態度、命令口調(「〇〇して」「ダメ!」など)で接していませんか?', opt1:'している', opt2:'していない', obs:'見たこと・聞いたことがある'},
 {n:4, text:'利用者への声掛けなしに介助したり、勝手に私物に触ったりしていませんか?', opt1:'している', opt2:'していない', obs:'見たことがある'},
 {n:5, text:'利用者のプライバシーに配慮せず、職員同士で話題にしたり、個人情報を取り扱ったりしていませんか?', opt1:'している', opt2:'していない', obs:'聞いたことがある'},
 {n:6, text:'利用者に対して、「ちょっと待って」を乱用し、長時間待たせていませんか?', opt1:'いる', opt2:'いない', obs:'見たこと・聞いたことがある'},
 {n:7, text:'利用者に必要な日用品（眼鏡、義歯、補聴器など）や道具（コールボタンなど）が壊れていたり、使えなかったりしていませんか？', opt1:'ある', opt2:'ない', obs:null},
 {n:8, text:'利用者の呼びかけやコールを無視したり、意見や訴えに否定的な態度をとったりしていませんか?', opt1:'している', opt2:'していない', obs:'見たことがある'},
 {n:9, text:'食事や入浴介助の無理強いなど、利用者に嫌悪感を抱かせるような援助を強要していませんか?', opt1:'している', opt2:'していない', obs:'見たことがある'},
 {n:10, text:'利用者の身体で遊んだり、人格を無視した関わり(落書きをする、くすぐるなど)をしたりしていませんか?', opt1:'している', opt2:'していない', obs:'見たことがある'},
 {n:11, text:'利用者や利用者の家族の言動をあざ笑ったり、悪口を言ったりしていませんか?', opt1:'している', opt2:'していない', obs:'聞いたことがある'},
 {n:12, text:'プライバシーへの配慮に欠けたケア(排泄について大声で話す、カーテンを開けたまま排泄ケアをするなど)していませんか?', opt1:'している', opt2:'していない', obs:'見たことがある'},
 {n:13, text:'利用者に対して乱暴で雑な介助や、いい加減な態度・受け答えをしていませんか?', opt1:'している', opt2:'していない', obs:'見たこと・聞いたことがある'},
 {n:14, text:'他の職員に仕事に関わる相談ができない等、職場でのコミュニケーションがとりにくくなっていませんか?', opt1:'とりにくい', opt2:'良好', obs:null},
 {n:15, text:'他の職員が行っているサービス提供・ケアに問題があると感じることはありませんか?', opt1:'ある', opt2:'ない', obs:null}
];

var answers = {};

// ==== タブ切替 ====
function switchTab(tab){
  document.getElementById('view-survey').classList.toggle('active', tab==='survey');
  document.getElementById('view-committee').classList.toggle('active', tab==='committee');
  document.getElementById('tabSurveyBtn').classList.toggle('active', tab==='survey');
  document.getElementById('tabCommitteeBtn').classList.toggle('active', tab==='committee');
}

// ==== 初期化：施設セレクト ====
(function initFacilitySelect(){
  var sel = document.getElementById('facilitySelect');
  FACILITIES.forEach(function(f){
    var o = document.createElement('option');
    o.value = f; o.textContent = f;
    sel.appendChild(o);
  });
})();

// ==== 質問カード描画 ====
(function renderQuestions(){
  var wrap = document.getElementById('questionsWrap');
  QUESTIONS.forEach(function(q){
    var div = document.createElement('div');
    div.className = 'qcard';
    var obsHtml = '';
    if(q.obs){
      obsHtml = '<label class="obs-row"><input type="checkbox" id="obs'+q.n+'" onchange="setObs('+q.n+',this.checked)"> '+q.obs+'（見たり聞いたりしたことがある場合はチェック）</label>';
    }
    div.innerHTML =
      '<span class="qnum">Q'+q.n+'</span>'+
      '<p class="qtext">'+q.text+'</p>'+
      '<div class="opts">'+
        '<div class="opt-btn" id="opt'+q.n+'_1" onclick="selectOpt('+q.n+',\''+q.opt1+'\',1)">'+q.opt1+'</div>'+
        '<div class="opt-btn" id="opt'+q.n+'_2" onclick="selectOpt('+q.n+',\''+q.opt2+'\',2)">'+q.opt2+'</div>'+
      '</div>'+
      obsHtml;
    wrap.appendChild(div);
  });
})();

function selectOpt(n, value, idx){
  answers['q'+n] = value;
  document.getElementById('opt'+n+'_1').classList.toggle('selected', idx===1);
  document.getElementById('opt'+n+'_2').classList.toggle('selected', idx===2);
}
function setObs(n, checked){
  answers['q'+n+'_obs'] = checked;
}

function showToast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  setTimeout(function(){ t.style.display = 'none'; }, 2600);
}

// ==== 送信 ====
document.getElementById('submitBtn').addEventListener('click', function(){
  var round = document.getElementById('roundInput').value.trim();
  var facility = document.getElementById('facilitySelect').value;
  if(!round){ showToast('実施回を入力してください'); return; }
  if(!facility){ showToast('施設を選択してください'); return; }
  for(var i=0;i<QUESTIONS.length;i++){
    if(!answers['q'+QUESTIONS[i].n]){
      showToast('Q'+QUESTIONS[i].n+'に回答してください');
      return;
    }
  }
  var payload = Object.assign({round: round, facility: facility}, answers);
  fetch(GAS_URL, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify(payload)
  }).then(function(){
    showToast('送信しました。ご協力ありがとうございました。');
    answers = {};
    document.querySelectorAll('.opt-btn.selected').forEach(function(el){ el.classList.remove('selected'); });
    document.querySelectorAll('.obs-row input').forEach(function(el){ el.checked = false; });
    document.getElementById('roundInput').value = '';
    document.getElementById('facilitySelect').value = '';
    window.scrollTo(0,0);
  }).catch(function(){
    showToast('送信に失敗しました。通信環境をご確認ください。');
  });
});

// ==== 委員会：ロック ====
function checkPassword(){
  var v = document.getElementById('pwInput').value;
  if(v === COMMITTEE_PASSWORD){
    document.getElementById('lockScreen').style.display = 'none';
    document.getElementById('committeeBody').style.display = 'block';
    loadCommitteeData();
  } else {
    showToast('パスワードが違います');
  }
}

var allData = null;

function loadCommitteeData(){
  fetch(GAS_URL).then(function(r){ return r.json(); }).then(function(data){
    allData = data;
    renderStaffGrid(data.staffCounts);
    renderFilters(data.responses);
    renderRates(data);
    renderAggTable();
    renderQr();
  }).catch(function(){
    showToast('データの取得に失敗しました');
  });
}

function renderStaffGrid(staffCounts){
  var wrap = document.getElementById('staffGrid');
  wrap.innerHTML = '';
  FACILITIES.forEach(function(f){
    var row = document.createElement('div');
    row.className = 'staff-grid';
    var val = (staffCounts && staffCounts[f]) ? staffCounts[f] : 0;
    row.innerHTML = '<span>'+f+'</span><input type="number" min="0" id="staffCount_'+f+'" value="'+val+'">';
    wrap.appendChild(row);
  });
}

function saveStaffCounts(){
  var counts = {};
  FACILITIES.forEach(function(f){
    counts[f] = document.getElementById('staffCount_'+f).value;
  });
  fetch(GAS_URL, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({type:'staffCounts', counts: counts})
  }).then(function(){
    showToast('職員数を保存しました');
    loadCommitteeData();
  }).catch(function(){
    showToast('保存に失敗しました');
  });
}

function renderRates(data){
  var wrap = document.getElementById('rateWrap');
  wrap.innerHTML = '';
  FACILITIES.forEach(function(f){
    var staff = (data.staffCounts && data.staffCounts[f]) ? data.staffCounts[f] : 0;
    var collected = data.responses.filter(function(r){ return r.facility === f; }).length;
    var rate = staff ? Math.round(collected/staff*1000)/10 : 0;
    var div = document.createElement('div');
    div.className = 'rate-card';
    div.innerHTML = '<span>'+f+'</span><span><b>'+collected+'</b> / '+staff+'名　('+rate+'%)</span>';
    wrap.appendChild(div);
  });
  var totalStaff = FACILITIES.reduce(function(s,f){ return s + ((data.staffCounts && data.staffCounts[f]) ? data.staffCounts[f] : 0); },0);
  var totalCollected = data.responses.length;
  var totalRate = totalStaff ? Math.round(totalCollected/totalStaff*1000)/10 : 0;
  var totalDiv = document.createElement('div');
  totalDiv.className = 'rate-card';
  totalDiv.style.background = '#f0ede3';
  totalDiv.innerHTML = '<span><b>全体</b></span><span><b>'+totalCollected+'</b> / '+totalStaff+'名　('+totalRate+'%)</span>';
  wrap.appendChild(totalDiv);
}

function renderFilters(responses){
  var rounds = Array.from(new Set(responses.map(function(r){ return r.round; }))).filter(Boolean);
  var roundSel = document.getElementById('roundFilter');
  roundSel.innerHTML = '<option value="__all__">すべての実施回（累計）</option>' +
    rounds.map(function(r){ return '<option value="'+r+'">'+r+'</option>'; }).join('');
  roundSel.onchange = renderAggTable;

  var facSel = document.getElementById('facilityFilter');
  facSel.innerHTML = '<option value="__all__">すべての施設</option>' +
    FACILITIES.map(function(f){ return '<option value="'+f+'">'+f+'</option>'; }).join('');
  facSel.onchange = renderAggTable;
}

function currentFiltered(){
  if(!allData) return [];
  var round = document.getElementById('roundFilter').value;
  var facility = document.getElementById('facilityFilter').value;
  return allData.responses.filter(function(r){
    var okRound = (round === '__all__') || (r.round === round);
    var okFac = (facility === '__all__') || (r.facility === facility);
    return okRound && okFac;
  });
}

function renderAggTable(){
  var rows = currentFiltered();
  var total = rows.length;
  var maxOpts = 3;

  var thead = '<tr><th>No.</th><th>チェック項目</th><th colspan="3">結果</th></tr>';

  var trs = QUESTIONS.map(function(q){
    var opts = [q.opt1, q.opt2];
    if(q.obs) opts.push(q.obs);
    var cells = opts.map(function(o){
      var count;
      if(q.obs && o === q.obs){
        count = rows.filter(function(r){ return r['q'+q.n+'_obs'] === '○'; }).length;
      } else {
        count = rows.filter(function(r){ return r['q'+q.n] === o; }).length;
      }
      var pct = total ? Math.round(count/total*1000)/10 : 0;
      var warn = (total && pct >= 35) ? ' class="warn"' : '';
      return '<td'+warn+'>'+o+'<br>'+count+'件（'+pct+'%）</td>';
    }).join('');
    for(var i=opts.length;i<maxOpts;i++){ cells += '<td>―</td>'; }
    return '<tr><td>'+q.n+'</td><td class="qtext-cell">'+q.text+'</td>'+cells+'</tr>';
  }).join('');

  document.getElementById('aggTableWrap').innerHTML =
    '<table class="agg"><thead>'+thead+'</thead><tbody>'+trs+'</tbody></table>'+
    '<p class="note">回答総数：'+total+'件</p>';
}

// ==== Excelエクスポート ====
document.getElementById('exportBtn').addEventListener('click', function(){
  var rows = currentFiltered();
  var total = rows.length;
  var sheetData = [['No.','チェック項目','選択肢','件数','割合(%)','35%以上']];
  QUESTIONS.forEach(function(q){
    var opts = [q.opt1, q.opt2];
    if(q.obs) opts.push(q.obs);
    opts.forEach(function(o){
      var count;
      if(q.obs && o === q.obs){
        count = rows.filter(function(r){ return r['q'+q.n+'_obs'] === '○'; }).length;
      } else {
        count = rows.filter(function(r){ return r['q'+q.n] === o; }).length;
      }
      var pct = total ? Math.round(count/total*1000)/10 : 0;
      sheetData.push([q.n, q.text, o, count, pct, (total && pct>=35) ? '★' : '']);
    });
  });
  var ws = XLSX.utils.aoa_to_sheet(sheetData);
  ws['!cols'] = [{wch:5},{wch:50},{wch:20},{wch:8},{wch:10},{wch:8}];
  var wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, '集計結果');
  var round = document.getElementById('roundFilter').value;
  var label = round === '__all__' ? '累計' : round;
  XLSX.writeFile(wb, '虐待の芽チェックリスト集計_' + label + '.xlsx');
});

// ==== QRコード ====
function renderQr(){
  var url = window.location.href.split('#')[0];
  document.getElementById('urlText').textContent = url;
  var qrDiv = document.getElementById('qrcode');
  qrDiv.innerHTML = '';
  new QRCode(qrDiv, { text: url, width: 180, height: 180 });
}
</script>

</body>
</html>
